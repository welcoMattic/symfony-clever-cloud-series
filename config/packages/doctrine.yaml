parameters:
    # Repli utilisé en local, quand aucun add-on Clever n'est branché.
    app.database_url_fallback: '%env(resolve:DATABASE_URL)%'

doctrine:
    dbal:
        # Sur Clever, l'add-on PostgreSQL injecte POSTGRESQL_ADDON_URI et cette
        # valeur gagne. En local, la variable n'existe pas et Doctrine retombe
        # sur DATABASE_URL, lu depuis .env.
        url: '%env(default:app.database_url_fallback:POSTGRESQL_ADDON_URI)%'

        # L'URI de l'add-on ne porte pas de serverVersion : sans cette
        # ligne, la connexion ne peut pas être construite.
        server_version: '%env(DATABASE_SERVER_VERSION)%'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
