# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Sur Clever, le trafic arrive par un reverse proxy : sans cette ligne,
    # Symfony croit toutes les requêtes en HTTP et voit l'IP du proxy.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@prod:
    framework:
        session:
            # L'add-on Redis injecte REDIS_URL, que SessionHandlerFactory
            # reconnaît : les sessions deviennent partagées entre les instances.
            # Indispensable sur le runtime frankenphp, où la plateforme ne monte
            # aucun stockage de sessions.
            handler_id: '%env(REDIS_URL)%'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
